name: jianghu-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jianghu
      POSTGRES_USER: jianghu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "55432:5432"
    volumes:
      - jianghu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jianghu -d jianghu"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - jianghu-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../services/api
    env_file:
      - ../services/api/.env
    environment:
      JIANGHU_DATABASE_URL: postgresql+psycopg://jianghu:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/jianghu
      JIANGHU_REDIS_URL: redis://redis:6379/0
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"]

volumes:
  jianghu-postgres:
  jianghu-redis:
