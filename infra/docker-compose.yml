name: jianghu-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jianghu
      POSTGRES_USER: jianghu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "55432:5432"
    volumes:
      - jianghu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jianghu -d jianghu"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - jianghu-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jianghu-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jianghu-local-secret-change-me}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - jianghu-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:1.4_base
    volumes:
      - jianghu-clamav:/var/lib/clamav

  api:
    build:
      context: ../services/api
    env_file:
      - ../services/api/.env
    environment:
      JIANGHU_DATABASE_URL: postgresql+psycopg://jianghu:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/jianghu
      JIANGHU_REDIS_URL: redis://redis:6379/0
      JIANGHU_MEDIA_STORAGE_PROVIDER: minio
      JIANGHU_MINIO_ENDPOINT: minio:9000
      JIANGHU_MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:19000}
      JIANGHU_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-jianghu-local}
      JIANGHU_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-jianghu-local-secret-change-me}
      JIANGHU_MEDIA_VIRUS_SCANNER: clamav
      JIANGHU_CLAMAV_HOST: clamav
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    command: ["sh", "-c", "alembic upgrade head && python -m app.domains.catalog.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"]

  worker:
    build:
      context: ../services/api
    env_file:
      - ../services/api/.env
    environment:
      JIANGHU_DATABASE_URL: postgresql+psycopg://jianghu:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/jianghu
      JIANGHU_REDIS_URL: redis://redis:6379/0
      JIANGHU_MEDIA_STORAGE_PROVIDER: minio
      JIANGHU_MINIO_ENDPOINT: minio:9000
      JIANGHU_MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:19000}
      JIANGHU_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-jianghu-local}
      JIANGHU_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-jianghu-local-secret-change-me}
      JIANGHU_MEDIA_VIRUS_SCANNER: clamav
      JIANGHU_CLAMAV_HOST: clamav
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    command: ["python", "-m", "app.domains.media.worker"]

volumes:
  jianghu-postgres:
  jianghu-redis:
  jianghu-minio:
  jianghu-clamav:
