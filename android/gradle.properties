# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Force Gradle to use JBR 21 (AGP 8.7.3 不支持 JDK 25；本机 JAVA_HOME=jdk-25.0.3 会导致 "What went wrong: 25.0.3")
# 注意:不同机器的用户名不同,JDK 路径不能硬编码。优先级:
#   1. 设系统环境变量 JAVA_HOME 指向 JBR / JDK 21(推荐)
#   2. 让 Android Studio 用它自带的 JBR(什么都不写)
#   3. 在 android/local.properties 里加 java.home=... 覆盖(此文件在 .gitignore 里,不入库)
# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin
kotlin.code.style=official

# Proxy — 各机器环境不同,不硬编码。需要在代理后上网时:
#   1. 设系统环境变量 http_proxy / https_proxy(推荐)
#   2. 或在 android/local.properties 里覆盖(不入库)
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=65532
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=65532

# Compose
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
