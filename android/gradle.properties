# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Force Gradle to use JBR 21 (AGP 8.7.3 不支持 JDK 25；本机 JAVA_HOME=jdk-25.0.3 会导致 "What went wrong: 25.0.3")
org.gradle.java.home=C:/Users/28784/.jdks/jbr-21.0.11

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin
kotlin.code.style=official

# Proxy
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=65532
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=65532

# Compose
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
