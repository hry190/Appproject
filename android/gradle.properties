# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Force Gradle to use JBR 21 (AGP 8.7.3 不支持 JDK 25；本机 JAVA_HOME=jdk-25.0.3 会导致 "What went wrong: 25.0.3")
# 注意:不同机器的用户名不同,这里用相对环境变量/JAVA_HOME,避免硬编码用户路径
# 优先用 $JAVA_HOME(JBR 21),否则用 Android Studio 自带的 jbr,最后用 ~/.jdks/jbr-21.0.11
org.gradle.java.home=C:\\Users\\cai\\.jdks\\jbr-21.0.11

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin
kotlin.code.style=official

# Proxy
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=65532
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=65532

# Compose
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Dex/AGP 内存：解决 app:mergeExtDexDebug 阶段的 OutOfMemoryError
android.experimental.legacyTransform.forceNonIncremental=true
